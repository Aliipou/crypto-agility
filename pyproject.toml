[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-agility"
version = "0.1.0"
description = "Cryptographic-agility provider: swap signature/KEM algorithms by id, hybrid (classical+PQC) fail-closed, anti-downgrade negotiation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Pourrahim" }]
keywords = ["crypto-agility", "post-quantum", "pqc", "hybrid", "negotiation"]
dependencies = ["cryptography>=42"]

[tool.setuptools]
packages = ["crypto_agility"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["F401", "B"]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.10"
packages = ["crypto_agility"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
